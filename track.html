<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تتبع طلبك | SONAA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet"><style>body{font-family:'Cairo';background:#07172f;color:white}input{color:#111 !important}</style></head>
<body>
<div class="text-center py-2 text-[12px] font-black" style="background:#d4af62;color:#07172f">SONAA TECH • تتبع طلبك</div>
<header class="py-3 text-center" style="border-bottom:1px solid rgba(212,175,98,.35)"><a href="index.html"><img src="https://drive.google.com/thumbnail?id=1nNKF9IgPlwRIEB0XChnVppeCn7NJRiVS&sz=w1000" class="h-12 mx-auto"></a></header>
<main class="max-w-md mx-auto px-4 py-8">
<div class="p-6 rounded-2xl" style="background:#0a1d38;border:1px solid rgba(212,175,98,.55)">
<h1 class="font-black text-center">تتبع حالة طلبك</h1><p class="text-xs text-center mt-1" style="color:#aab6c8">اكتب رقم الطلب ورقم الهاتف - بدون ما تتصل بينا</p>
<input id="reqNo" placeholder="SONAA-REQ-000125" class="w-full p-3 border rounded-xl mt-4 text-center font-mono">
<input id="phone" placeholder="رقم الهاتف" class="w-full p-3 border rounded-xl mt-3 text-center">
<button onclick="track()" class="w-full py-3 rounded-xl font-black mt-3" style="background:#d4af62;color:#07172f">تتبع</button>
<div id="res" class="mt-4"></div>
</div></main>
<script>
const SUPABASE_URL="https://bjznlnuljvqubscjymjx.supabase.co";const SUPABASE_KEY="sb_publishable_k1Q9BX9gRhHl4Lq9vpOmgQ_-JrZ5pQ6";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const stages=["جديد","قيد المراجعة","مقبول مبدئياً","بانتظار الدفع","مدفوع","قيد التجهيز","نشط","مرفوض"];
async function track(){const no=document.getElementById("reqNo").value.trim();const ph=document.getElementById("phone").value.trim();if(!no||!ph){document.getElementById("res").innerHTML="<div class='text-center text-red-300 font-bold text-sm'>اكتب الرقمين</div>";return;}
const {data}=await sb.from("org_requests").select("*").eq("request_no",no).eq("phone",ph).maybeSingle();
if(!data){document.getElementById("res").innerHTML="<div class='text-center p-4 rounded-xl bg-red-500/10 border border-red-400 text-red-200 font-bold text-sm'>ما لقينا طلب بالبيانات دي - اتأكد من الرقم والتلفون</div>";return;}
const idx=stages.indexOf(data.status);
let html=`<div class="text-center"><div class="font-black">${data.org_name}</div><div class="text-xs" style="color:#aab6c8">${data.org_type} - ${data.org_state} ${data.org_city}</div><div class="mt-3 font-black px-3 py-2 rounded-full text-sm inline-block" style="background:#d4af62;color:#07172f">${data.status}</div></div><div class="mt-4 space-y-2">`;
stages.forEach((s,i)=>{const done=i<=idx;html+=`<div class="flex items-center gap-2 text-xs font-bold"><div class="w-6 h-6 rounded-full flex items-center justify-center ${done?'text-black':''}" style="background:${done?'#d4af62':'#1e293b'}">${done?'✓':i+1}</div><span style="color:${done?'white':'#64748b'}">${s}</span></div>`});
html+=`</div><div class="mt-4 p-3 rounded-xl text-xs font-bold text-center" style="background:#07172f">فاتورة: ${data.invoice_amount||0} - رصيد معتمد: ${data.credits_approved||0} شهادة</div>`;
document.getElementById("res").innerHTML=html;}
const p=new URLSearchParams(location.search);if(p.get("req")){document.getElementById("reqNo").value=p.get("req");}
</script></body></html>
